name: Deploy de producao

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/radar-front/package-lock.json
      - run: npm ci
        working-directory: frontend/radar-front
      - run: npm run lint
        working-directory: frontend/radar-front
      - run: npm run build
        working-directory: frontend/radar-front
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q backend

  publicar:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: validar
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configurar chave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Atualizar servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only origin main && sh scripts/deploy_vps.sh"
