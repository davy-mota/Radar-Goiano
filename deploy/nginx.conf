proxy_cache_path /var/cache/nginx/radar levels=1:2 keys_zone=radar_cache:20m
                 max_size=2g inactive=30m use_temp_path=off;
limit_req_zone $http_cf_connecting_ip zone=api_por_ip:10m rate=10r/s;
limit_conn_zone $http_cf_connecting_ip zone=conexoes_por_ip:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location /backend/ {
        limit_req zone=api_por_ip burst=30 nodelay;
        limit_req_status 429;
        limit_conn conexoes_por_ip 20;
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 35s;
        proxy_cache radar_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        proxy_pass http://api:8000/health;
        proxy_set_header Host localhost;
        proxy_cache off;
    }
}
